<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - DevBridge</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">DevBridge</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="my-skills.html">My Skills</a></li>
                <li><a href="opportunities.html">Opportunities</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section style="max-width: 420px; margin: 60px auto; padding: 0 20px;">
        <h1 style="margin-bottom: 8px;">Create Account</h1>
        <p style="color: #666; margin-bottom: 24px;">Join DevBridge and start applying to opportunities.</p>

        <div id="signup-success" style="display:none; background:#f0fdf4; border:1px solid #bbf7d0; padding:16px; border-radius:8px; margin-bottom:16px;">
            <strong>Check your email!</strong>
            <p style="margin-top:6px;">We sent a confirmation link to your inbox. Click it, then <a href="login.html">log in</a>.</p>
        </div>

        <form id="signup-form">
            <div style="margin-bottom: 16px;">
                <label for="signup-name" style="display:block; margin-bottom:6px; font-weight:600;">Full Name</label>
                <input type="text" id="signup-name" required placeholder="Your full name"
                    style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px;">
            </div>
            <div style="margin-bottom: 16px;">
                <label for="signup-email" style="display:block; margin-bottom:6px; font-weight:600;">Email</label>
                <input type="email" id="signup-email" required placeholder="you@email.com"
                    style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px;">
            </div>
            <div style="margin-bottom: 16px;">
                <label for="signup-password" style="display:block; margin-bottom:6px; font-weight:600;">Password</label>
                <input type="password" id="signup-password" required placeholder="At least 6 characters" minlength="6"
                    style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px;">
            </div>
            <div id="signup-error" style="color:#dc2626; margin-bottom:12px; display:none;"></div>
            <button type="submit" class="cta-button primary" style="width:100%; padding:12px;">Sign Up</button>
        </form>

        <p style="margin-top: 20px; text-align:center;">
            Already have an account? <a href="login.html">Log in</a>
        </p>
    </section>

    <script src="supabase.js"></script>
    <script src="auth.js"></script>
    <script>
        document.getElementById('signup-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const errorEl = document.getElementById('signup-error');
            errorEl.style.display = 'none';

            try {
                const result = await Auth.signUp(name, email, password);
                if (Auth.isLoggedIn()) {
                    // Email confirmation is off — user is logged in immediately
                    window.location.href = 'profile.html';
                } else {
                    // Email confirmation required — show message instead of redirecting
                    document.getElementById('signup-form').style.display = 'none';
                    document.getElementById('signup-success').style.display = 'block';
                }
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
